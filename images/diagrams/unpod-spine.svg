  <path d="M519 452 H591" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <path d="M797 452 H869" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <path d="M1075 452 H1147" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <path d="M1353 452 H1425" class="flow purple " stroke="#8d75ff" marker-end="url(#arrow-purple)"/>
  <text x="277" y="386" text-anchor="middle" class="tiny purpleText">
    <tspan x="277" dy="0">DELIVERS</tspan>
  </text>
  <text x="555" y="386" text-anchor="middle" class="tiny cyanText">
    <tspan x="555" dy="0">OWNS</tspan>
  </text>
  <text x="833" y="386" text-anchor="middle" class="tiny cyanText">
    <tspan x="833" dy="0">EACH TOUCH</tspan>
  </text>
  <text x="1111" y="386" text-anchor="middle" class="tiny cyanText">
    <tspan x="1111" dy="0">RESOLVES</tspan>
  </text>
  <text x="1389" y="386" text-anchor="middle" class="tiny purpleText">
    <tspan x="1389" dy="0">EMITS</tspan>
  </text>
  <path d="M714 314 L700 392" class="flow purple " stroke="#8d75ff" marker-end="url(#arrow-purple)"/>
  <path d="M966 314 L974 392" class="flow purple " stroke="#8d75ff" marker-end="url(#arrow-purple)"/>
  <path d="M1531 396 C1531 306 1300 248 1090 248" class="flow purple slow" stroke="#8d75ff" marker-end="url(#arrow-purple)"/>
  <text x="1320" y="330" text-anchor="middle" class="tiny purpleText">
    <tspan x="1320" dy="0">SIGNALS RESUME</tspan>
  </text>
  <text x="141" y="546" text-anchor="middle" class="tiny purpleText">
    <tspan x="141" dy="0">TRANSPORT</tspan>
  </text>
  <text x="836" y="546" text-anchor="middle" class="tiny cyanText">
    <tspan x="836" dy="0">COMMUNICATION STATE</tspan>
  </text>
  <text x="1531" y="546" text-anchor="middle" class="tiny purpleText">
    <tspan x="1531" dy="0">CONTROL</tspan>
  </text>
  <rect x="321" y="578" width="1030" height="136" rx="18" class="panel cyan"/>
  <text x="836" y="622" text-anchor="middle" class="label cyanText">
    <tspan x="836" dy="0">CONTEXT GRAPH</tspan>
  </text>
  <text x="836" y="678" text-anchor="middle" class="tiny">
    <tspan x="836" dy="0">FACTS - RELATIONSHIPS - SUMMARIES - VALIDITY</tspan>
  </text>
  <path d="M1253 512 V570" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <text x="1316" y="546" text-anchor="middle" class="tiny cyanText">
    <tspan x="1316" dy="0">FEEDS</tspan>
  </text>
  <path d="M419 570 V512" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <text x="360" y="546" text-anchor="middle" class="tiny cyanText">
    <tspan x="360" dy="0">READS</tspan>
  </text>
  <rect x="321" y="768" width="1030" height="152" rx="18" class="panel purple"/>
  <text x="836" y="812" text-anchor="middle" class="label purpleText">
    <tspan x="836" dy="0">CONTROL - GOVERNS THE SPINE</tspan>
  </text>
  <rect x="372" y="832" width="440" height="64" rx="12" class="box purple"/>
  <text x="592" y="870" text-anchor="middle" class="small">
    <tspan x="592" dy="0">TEAMS + SPACES</tspan>
  </text>
  <rect x="860" y="832" width="440" height="64" rx="12" class="box purple"/>
  <text x="1080" y="870" text-anchor="middle" class="small">
    <tspan x="1080" dy="0">POLICIES + APPROVALS</tspan>
  </text>
  <path d="M592 764 V722" class="flow purple " stroke="#8d75ff" marker-end="url(#arrow-purple)"/>
  <path d="M1080 764 V722" class="flow purple " stroke="#8d75ff" marker-end="url(#arrow-purple)"/>

</svg>
