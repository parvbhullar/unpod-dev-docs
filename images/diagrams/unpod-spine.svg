  </text>
  <rect x="321" y="400" width="196" height="104" rx="14" class="box cyan "/>
  <text x="419" y="459" text-anchor="middle" class="mid">
    <tspan x="419" dy="0">ENTITY</tspan>
  </text>
  <rect x="599" y="400" width="196" height="104" rx="14" class="box cyan "/>
  <text x="697" y="459" text-anchor="middle" class="mid">
    <tspan x="697" dy="0">CONVERSATION</tspan>
  </text>
  <rect x="877" y="400" width="196" height="104" rx="14" class="box cyan "/>
  <text x="975" y="459" text-anchor="middle" class="mid">
    <tspan x="975" dy="0">INTERACTION</tspan>
  </text>
  <rect x="1155" y="400" width="196" height="104" rx="14" class="box cyan "/>
  <text x="1253" y="459" text-anchor="middle" class="mid">
    <tspan x="1253" dy="0">OUTCOME</tspan>
  </text>
  <rect x="1433" y="400" width="196" height="104" rx="14" class="box purple "/>
  <text x="1531" y="459" text-anchor="middle" class="mid">
    <tspan x="1531" dy="0">EVENTS</tspan>
  </text>
