<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-label="BRIDGE LIFECYCLE">
  <defs>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#1a1d22" stroke-width="3" opacity="0.7"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8d75ff"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d8e8"/>
    </marker>
    <style>
      svg { background: #020303; }
      .title { font: 700 44px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f0f0; letter-spacing: 9px; }
      .label { font: 700 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f0f0; letter-spacing: 3px; }
      .small { font: 700 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #a8abb4; letter-spacing: 2px; }
      .tiny { font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #a8abb4; letter-spacing: 1px; }
      .panel { fill: url(#hatch); stroke: #4a4d55; stroke-width: 2; }
      .box { fill: #020303; stroke: #4a4d55; stroke-width: 2.5; }
      .purple { stroke: #8d75ff; }
      .cyan { stroke: #00d8e8; }
      .purpleText { fill: #8d75ff; }
      .cyanText { fill: #00d8e8; }
      .flow { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 14 22; animation: dash 1.8s linear infinite; }
      .flow.fast { animation-duration: 1.35s; }
      .flow.slow { animation-duration: 2.4s; }
      .dim { opacity: 0.72; }
      .pulse { filter: url(#glow); animation: pulse 1.7s ease-in-out infinite; transform-origin: center; }
      @keyframes dash { to { stroke-dashoffset: -36; } }
      @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .pulse { animation: none; }
      }
    </style>
  </defs>
  <rect width="1672" height="941" fill="#020303"/>
  <text x="836" y="70" text-anchor="middle" class="title">BRIDGE LIFECYCLE</text>
  
  <rect x="56" y="390" width="270" height="126" rx="16" class="box purple "/>
  <text x="191" y="446" text-anchor="middle" class="label">
    <tspan x="191" dy="0">CREATE BRIDGE</tspan>
    <tspan x="191" dy="30">DRAFT</tspan>
  </text>
  <rect x="430" y="390" width="270" height="126" rx="16" class="box cyan "/>
  <text x="565" y="446" text-anchor="middle" class="label">
    <tspan x="565" dy="0">CONNECT</tspan>
    <tspan x="565" dy="30">PROVIDER</tspan>
  </text>
  <rect x="804" y="390" width="270" height="126" rx="16" class="box cyan "/>
  <text x="939" y="446" text-anchor="middle" class="label">
    <tspan x="939" dy="0">ASSIGN</tspan>
    <tspan x="939" dy="30">NUMBERS</tspan>
  </text>
  <rect x="1178" y="390" width="220" height="126" rx="16" class="box purple "/>
  <text x="1288" y="461" text-anchor="middle" class="label">
    <tspan x="1288" dy="0">ACTIVE</tspan>
  </text>
  <rect x="1472" y="390" width="150" height="126" rx="16" class="box purple "/>
  <text x="1547" y="461" text-anchor="middle" class="label">
    <tspan x="1547" dy="0">DELETE</tspan>
  </text>
  <path d="M326 453 H420" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <path d="M700 453 H794" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <path d="M1074 453 H1168" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <path d="M1398 453 H1462" class="flow purple " stroke="#8d75ff" marker-end="url(#arrow-purple)"/>

</svg>
