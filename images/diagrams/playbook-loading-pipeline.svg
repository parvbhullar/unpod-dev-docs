<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-label="PLAYBOOK LOADING PIPELINE">
  <defs>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#1a1d22" stroke-width="3" opacity="0.7"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8d75ff"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d8e8"/>
    </marker>
    <style>
      svg { background: #020303; }
      .title { font: 700 44px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f0f0; letter-spacing: 9px; }
      .label { font: 700 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f0f0; letter-spacing: 3px; }
      .small { font: 700 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #a8abb4; letter-spacing: 2px; }
      .tiny { font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #a8abb4; letter-spacing: 1px; }
      .panel { fill: url(#hatch); stroke: #4a4d55; stroke-width: 2; }
      .box { fill: #020303; stroke: #4a4d55; stroke-width: 2.5; }
      .purple { stroke: #8d75ff; }
      .cyan { stroke: #00d8e8; }
      .purpleText { fill: #8d75ff; }
      .cyanText { fill: #00d8e8; }
      .flow { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 14 22; animation: dash 1.8s linear infinite; }
      .flow.fast { animation-duration: 1.35s; }
      .flow.slow { animation-duration: 2.4s; }
      .dim { opacity: 0.72; }
      .pulse { filter: url(#glow); animation: pulse 1.7s ease-in-out infinite; transform-origin: center; }
      @keyframes dash { to { stroke-dashoffset: -36; } }
      @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .pulse { animation: none; }
      }
    </style>
  </defs>
  <rect width="1672" height="941" fill="#020303"/>
  <text x="836" y="70" text-anchor="middle" class="title">PLAYBOOK LOADING PIPELINE</text>
  
  <rect x="54" y="242" width="300" height="86" rx="12" class="box purple"/>
  <text x="204" y="291" text-anchor="middle" class="small">
    <tspan x="204" dy="0">SIMPLE YAML</tspan>
  </text>
  <rect x="54" y="424" width="300" height="86" rx="12" class="box purple"/>
  <text x="204" y="473" text-anchor="middle" class="small">
    <tspan x="204" dy="0">FULL YAML</tspan>
  </text>
  <rect x="54" y="606" width="300" height="86" rx="12" class="box purple"/>
  <text x="204" y="655" text-anchor="middle" class="small">
    <tspan x="204" dy="0">LEGACY FLOW JSON</tspan>
  </text>
  <rect x="516" y="210" width="310" height="116" rx="16" class="box cyan "/>
  <text x="671" y="276" text-anchor="middle" class="label">
    <tspan x="671" dy="0">SIMPLE_TO_PLAYBOOK</tspan>
  </text>
  <rect x="516" y="398" width="310" height="116" rx="16" class="box cyan "/>
  <text x="671" y="464" text-anchor="middle" class="label">
    <tspan x="671" dy="0">PLAYBOOK.LOAD</tspan>
  </text>
  <rect x="516" y="584" width="310" height="116" rx="16" class="box cyan "/>
  <text x="671" y="650" text-anchor="middle" class="label">
    <tspan x="671" dy="0">COMPILE_FLOW</tspan>
  </text>
  <rect x="988" y="292" width="360" height="300" rx="18" class="panel purple"/>
  <text x="1168" y="336" text-anchor="middle" class="label purpleText">
    <tspan x="1168" dy="0">VALIDATED ARTIFACT</tspan>
  </text>
  <rect x="1030" y="386" width="276" height="112" rx="16" class="box purple "/>
  <text x="1168" y="435" text-anchor="middle" class="label">
    <tspan x="1168" dy="0">PLAYBOOK</tspan>
    <tspan x="1168" dy="30">IR</tspan>
  </text>
  <rect x="1442" y="386" width="180" height="112" rx="16" class="box cyan "/>
  <text x="1532" y="450" text-anchor="middle" class="label">
    <tspan x="1532" dy="0">RUNTIME</tspan>
  </text>
  <path d="M354 285 H506" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <path d="M354 467 H506" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <path d="M354 649 H506" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <path d="M826 268 C918 268 918 442 978 442" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <path d="M826 456 H978" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <path d="M826 642 C918 642 918 442 978 442" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <path d="M1348 442 H1432" class="flow purple " stroke="#8d75ff" marker-end="url(#arrow-purple)"/>

</svg>
