<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-label="EVENTS ON THE SPINE">
  <defs>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#1a1d22" stroke-width="3" opacity="0.7"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8d75ff"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d8e8"/>
    </marker>
    <style>
      svg { background: #020303; }
      .title { font: 700 44px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f0f0; letter-spacing: 9px; }
      .label { font: 700 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f0f0; letter-spacing: 3px; }
      .small { font: 700 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #a8abb4; letter-spacing: 2px; }
      .tiny { font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #a8abb4; letter-spacing: 1px; }
      .mid { font: 700 19px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f0f0; letter-spacing: 2px; }
      .panel { fill: url(#hatch); stroke: #4a4d55; stroke-width: 2; }
      .box { fill: #020303; stroke: #4a4d55; stroke-width: 2.5; }
      .purple { stroke: #8d75ff; }
      .cyan { stroke: #00d8e8; }
      .purpleText { fill: #8d75ff; }
      .cyanText { fill: #00d8e8; }
      .flow { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 14 22; animation: dash 1.8s linear infinite; }
      .flow.fast { animation-duration: 1.35s; }
      .flow.slow { animation-duration: 2.4s; }
      .dim { opacity: 0.72; }
      .pulse { filter: url(#glow); animation: pulse 1.7s ease-in-out infinite; transform-origin: center; }
      @keyframes dash { to { stroke-dashoffset: -36; } }
      @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .pulse { animation: none; }
      }
    </style>
  </defs>
  <rect width="1672" height="941" fill="#020303"/>
  <text x="836" y="70" text-anchor="middle" class="title">EVENTS ON THE SPINE</text>
  
  <rect x="56" y="150" width="340" height="740" rx="18" class="panel cyan"/>
  <text x="226" y="194" text-anchor="middle" class="label cyanText">
    <tspan x="226" dy="0">THE SPINE</tspan>
  </text>
  <rect x="76" y="240" width="300" height="110" rx="14" class="box cyan "/>
  <text x="226" y="302" text-anchor="middle" class="mid">
    <tspan x="226" dy="0">ENTITY</tspan>
  </text>
  <rect x="76" y="400" width="300" height="110" rx="14" class="box cyan "/>
  <text x="226" y="462" text-anchor="middle" class="mid">
    <tspan x="226" dy="0">CONVERSATION</tspan>
  </text>
  <rect x="76" y="560" width="300" height="110" rx="14" class="box cyan "/>
  <text x="226" y="622" text-anchor="middle" class="mid">
    <tspan x="226" dy="0">INTERACTION</tspan>
  </text>
  <rect x="76" y="720" width="300" height="110" rx="14" class="box cyan "/>
  <text x="226" y="782" text-anchor="middle" class="mid">
    <tspan x="226" dy="0">OUTCOME</tspan>
  </text>
  <path d="M226 356 V392" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <path d="M226 516 V552" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <path d="M226 676 V712" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <rect x="640" y="150" width="380" height="740" rx="18" class="panel cyan"/>
  <text x="830" y="194" text-anchor="middle" class="label cyanText">
    <tspan x="830" dy="0">EVENT STREAM</tspan>
  </text>
  <rect x="680" y="300" width="300" height="120" rx="14" class="box cyan pulse"/>
  <text x="830" y="367" text-anchor="middle" class="mid">
    <tspan x="830" dy="0">EVENTS</tspan>
  </text>
  <rect x="680" y="500" width="300" height="64" rx="12" class="box cyan"/>
  <text x="830" y="538" text-anchor="middle" class="small">
    <tspan x="830" dy="0">APPEND ONLY</tspan>
  </text>
  <rect x="680" y="600" width="300" height="64" rx="12" class="box cyan"/>
  <text x="830" y="638" text-anchor="middle" class="small">
    <tspan x="830" dy="0">ONCE-ONLY DELIVERY</tspan>
  </text>
  <text x="830" y="730" text-anchor="middle" class="tiny">
    <tspan x="830" dy="0">STABLE SCHEMAS</tspan>
  </text>
  <text x="830" y="770" text-anchor="middle" class="tiny">
    <tspan x="830" dy="0">BROKER STAYS HIDDEN</tspan>
  </text>
  <path d="M400 295 H630" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <path d="M400 455 H630" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <path d="M400 615 H630" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <path d="M400 775 H630" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <text x="515" y="262" text-anchor="middle" class="tiny cyanText">
    <tspan x="515" dy="0">EMITS</tspan>
  </text>
  <rect x="1230" y="150" width="380" height="740" rx="18" class="panel purple"/>
  <text x="1420" y="194" text-anchor="middle" class="label purpleText">
    <tspan x="1420" dy="0">CONSUMERS</tspan>
  </text>
  <rect x="1270" y="250" width="300" height="100" rx="14" class="box purple "/>
  <text x="1420" y="307" text-anchor="middle" class="mid">
    <tspan x="1420" dy="0">WEBHOOKS</tspan>
  </text>
  <rect x="1270" y="390" width="300" height="100" rx="14" class="box purple "/>
  <text x="1420" y="447" text-anchor="middle" class="mid">
    <tspan x="1420" dy="0">SUBSCRIPTIONS</tspan>
  </text>
  <rect x="1270" y="530" width="300" height="100" rx="14" class="box purple "/>
  <text x="1420" y="587" text-anchor="middle" class="mid">
    <tspan x="1420" dy="0">REPLAY</tspan>
  </text>
  <rect x="1270" y="670" width="300" height="120" rx="14" class="box purple "/>
  <text x="1420" y="724" text-anchor="middle" class="mid">
    <tspan x="1420" dy="0">FLOWS +</tspan>
    <tspan x="1420" dy="26">JOURNEYS</tspan>
  </text>
  <path d="M1022 300 H1260" class="flow purple " stroke="#8d75ff" marker-end="url(#arrow-purple)"/>
  <path d="M1022 440 H1260" class="flow purple " stroke="#8d75ff" marker-end="url(#arrow-purple)"/>
  <path d="M1022 580 H1260" class="flow purple " stroke="#8d75ff" marker-end="url(#arrow-purple)"/>
  <path d="M1022 730 H1260" class="flow purple " stroke="#8d75ff" marker-end="url(#arrow-purple)"/>
  <text x="1120" y="268" text-anchor="middle" class="tiny purpleText">
    <tspan x="1120" dy="0">DELIVERS</tspan>
  </text>
  <text x="1120" y="700" text-anchor="middle" class="tiny purpleText">
    <tspan x="1120" dy="0">RESUMES</tspan>
  </text>

</svg>
