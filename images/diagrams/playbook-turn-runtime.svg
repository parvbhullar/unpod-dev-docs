<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-label="PLAYBOOK TURN RUNTIME">
  <defs>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#1a1d22" stroke-width="3" opacity="0.7"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8d75ff"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d8e8"/>
    </marker>
    <style>
      svg { background: #020303; }
      .title { font: 700 44px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f0f0; letter-spacing: 9px; }
      .label { font: 700 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f0f0; letter-spacing: 3px; }
      .small { font: 700 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #a8abb4; letter-spacing: 2px; }
      .tiny { font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #a8abb4; letter-spacing: 1px; }
      .panel { fill: url(#hatch); stroke: #4a4d55; stroke-width: 2; }
      .box { fill: #020303; stroke: #4a4d55; stroke-width: 2.5; }
      .purple { stroke: #8d75ff; }
      .cyan { stroke: #00d8e8; }
      .purpleText { fill: #8d75ff; }
      .cyanText { fill: #00d8e8; }
      .flow { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 14 22; animation: dash 1.8s linear infinite; }
      .flow.fast { animation-duration: 1.35s; }
      .flow.slow { animation-duration: 2.4s; }
      .dim { opacity: 0.72; }
      .pulse { filter: url(#glow); animation: pulse 1.7s ease-in-out infinite; transform-origin: center; }
      @keyframes dash { to { stroke-dashoffset: -36; } }
      @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .pulse { animation: none; }
      }
    </style>
  </defs>
  <rect width="1672" height="941" fill="#020303"/>
  <text x="836" y="70" text-anchor="middle" class="title">PLAYBOOK TURN RUNTIME</text>
  
  <rect x="44" y="406" width="202" height="118" rx="12" class="box purple"/>
  <text x="145" y="471" text-anchor="middle" class="small">
    <tspan x="145" dy="0">USER TEXT</tspan>
  </text>
  <rect x="318" y="386" width="264" height="146" rx="16" class="box purple "/>
  <text x="450" y="452" text-anchor="middle" class="label">
    <tspan x="450" dy="0">PLAYBOOKAGENT</tspan>
    <tspan x="450" dy="30">TURN</tspan>
  </text>
  <rect x="720" y="132" width="420" height="292" rx="18" class="panel cyan"/>
  <text x="930" y="176" text-anchor="middle" class="label cyanText">
    <tspan x="930" dy="0">DIRECTOR TASK</tspan>
  </text>
  <rect x="760" y="208" width="340" height="54" rx="12" class="box cyan"/>
  <text x="930" y="241" text-anchor="middle" class="small">
    <tspan x="930" dy="0">APPEND UTTERANCE</tspan>
  </text>
  <rect x="760" y="282" width="340" height="54" rx="12" class="box cyan"/>
  <text x="930" y="315" text-anchor="middle" class="small">
    <tspan x="930" dy="0">EVALUATE SLOTS</tspan>
  </text>
  <rect x="760" y="356" width="340" height="54" rx="12" class="box cyan"/>
  <text x="930" y="389" text-anchor="middle" class="small">
    <tspan x="930" dy="0">QUIESCE RULES</tspan>
  </text>
  <rect x="720" y="518" width="420" height="292" rx="18" class="panel purple"/>
  <text x="930" y="562" text-anchor="middle" class="label purpleText">
    <tspan x="930" dy="0">TALKER STREAM</tspan>
  </text>
  <rect x="760" y="590" width="340" height="54" rx="12" class="box purple"/>
  <text x="930" y="623" text-anchor="middle" class="small">
    <tspan x="930" dy="0">SNAPSHOT STATE N</tspan>
  </text>
  <rect x="760" y="664" width="340" height="54" rx="12" class="box purple"/>
  <text x="930" y="697" text-anchor="middle" class="small">
    <tspan x="930" dy="0">SOFT OR HARD GATE</tspan>
  </text>
  <rect x="760" y="738" width="340" height="54" rx="12" class="box purple"/>
  <text x="930" y="771" text-anchor="middle" class="small">
    <tspan x="930" dy="0">TOKENS TO HOST</tspan>
  </text>
  <rect x="1270" y="324" width="282" height="120" rx="16" class="box cyan "/>
  <text x="1411" y="392" text-anchor="middle" class="label">
    <tspan x="1411" dy="0">JOIN</tspan>
  </text>
  <rect x="1270" y="590" width="282" height="120" rx="16" class="box cyan "/>
  <text x="1411" y="643" text-anchor="middle" class="label">
    <tspan x="1411" dy="0">DONE</tspan>
    <tspan x="1411" dy="30">CHECKPOINT + OUTCOME</tspan>
  </text>
  <path d="M246 465 H308" class="flow purple " stroke="#8d75ff" marker-end="url(#arrow-purple)"/>
  <path d="M582 430 C650 430 650 278 710 278" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <path d="M582 490 C650 490 650 664 710 664" class="flow purple " stroke="#8d75ff" marker-end="url(#arrow-purple)"/>
  <path d="M1140 280 C1210 280 1210 384 1260 384" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <path d="M1140 738 C1210 738 1210 650 1260 650" class="flow purple " stroke="#8d75ff" marker-end="url(#arrow-purple)"/>
  <path d="M1412 444 V580" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <text x="634" y="302" text-anchor="middle" class="tiny cyanText">
    <tspan x="634" dy="0">SHIELDED</tspan>
  </text>
  <text x="638" y="628" text-anchor="middle" class="tiny purpleText">
    <tspan x="638" dy="0">STREAMS</tspan>
  </text>

</svg>
