<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-label="OUTCOME ON THE SPINE">
  <defs>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#1a1d22" stroke-width="3" opacity="0.7"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8d75ff"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d8e8"/>
    </marker>
    <style>
      svg { background: #020303; }
      .title { font: 700 44px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f0f0; letter-spacing: 9px; }
      .label { font: 700 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f0f0; letter-spacing: 3px; }
      .small { font: 700 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #a8abb4; letter-spacing: 2px; }
      .tiny { font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #a8abb4; letter-spacing: 1px; }
      .mid { font: 700 19px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f0f0; letter-spacing: 2px; }
      .panel { fill: url(#hatch); stroke: #4a4d55; stroke-width: 2; }
      .box { fill: #020303; stroke: #4a4d55; stroke-width: 2.5; }
      .purple { stroke: #8d75ff; }
      .cyan { stroke: #00d8e8; }
      .purpleText { fill: #8d75ff; }
      .cyanText { fill: #00d8e8; }
      .flow { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 14 22; animation: dash 1.8s linear infinite; }
      .flow.fast { animation-duration: 1.35s; }
      .flow.slow { animation-duration: 2.4s; }
      .dim { opacity: 0.72; }
      .pulse { filter: url(#glow); animation: pulse 1.7s ease-in-out infinite; transform-origin: center; }
      @keyframes dash { to { stroke-dashoffset: -36; } }
      @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .pulse { animation: none; }
      }
    </style>
  </defs>
  <rect width="1672" height="941" fill="#020303"/>
  <text x="836" y="70" text-anchor="middle" class="title">OUTCOME ON THE SPINE</text>
  
  <rect x="560" y="140" width="460" height="112" rx="14" class="box purple "/>
  <text x="790" y="203" text-anchor="middle" class="mid">
    <tspan x="790" dy="0">FLOWS + JOURNEYS</tspan>
  </text>
  <rect x="80" y="400" width="320" height="140" rx="14" class="box purple "/>
  <text x="240" y="477" text-anchor="middle" class="mid">
    <tspan x="240" dy="0">INTERACTION</tspan>
  </text>
  <rect x="536" y="318" width="508" height="320" rx="18" class="panel cyan"/>
  <text x="790" y="362" text-anchor="middle" class="label cyanText">
    <tspan x="790" dy="0">OUTCOME RECORD</tspan>
  </text>
  <rect x="576" y="402" width="428" height="68" rx="12" class="box cyan"/>
  <text x="790" y="442" text-anchor="middle" class="small">
    <tspan x="790" dy="0">DEFAULT FIELDS</tspan>
  </text>
  <rect x="576" y="492" width="428" height="68" rx="12" class="box cyan"/>
  <text x="790" y="532" text-anchor="middle" class="small">
    <tspan x="790" dy="0">CUSTOM SCHEMA</tspan>
  </text>
  <text x="790" y="606" text-anchor="middle" class="tiny">
    <tspan x="790" dy="0">VERSIONED - ONE PER INTERACTION</tspan>
  </text>
  <rect x="1180" y="400" width="320" height="140" rx="14" class="box purple "/>
  <text x="1340" y="477" text-anchor="middle" class="mid">
    <tspan x="1340" dy="0">EVENTS</tspan>
  </text>
  <rect x="536" y="736" width="508" height="120" rx="14" class="box cyan "/>
  <text x="790" y="803" text-anchor="middle" class="mid">
    <tspan x="790" dy="0">CONTEXT GRAPH</tspan>
  </text>
  <path d="M402 470 H526" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <text x="464" y="436" text-anchor="middle" class="tiny cyanText">
    <tspan x="464" dy="0">TRANSCRIPT</tspan>
  </text>
  <path d="M1046 470 H1170" class="flow purple " stroke="#8d75ff" marker-end="url(#arrow-purple)"/>
  <text x="1108" y="436" text-anchor="middle" class="tiny purpleText">
    <tspan x="1108" dy="0">EMITS</tspan>
  </text>
  <path d="M790 642 V726" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <text x="878" y="690" text-anchor="middle" class="tiny cyanText">
    <tspan x="878" dy="0">ROLLS UP</tspan>
  </text>
  <path d="M790 314 V260" class="flow purple " stroke="#8d75ff" marker-end="url(#arrow-purple)"/>
  <text x="886" y="292" text-anchor="middle" class="tiny purpleText">
    <tspan x="886" dy="0">BRANCHES ON</tspan>
  </text>
  <text x="240" y="586" text-anchor="middle" class="tiny">
    <tspan x="240" dy="0">TURNS + TOOL RESULTS</tspan>
  </text>
  <text x="1340" y="586" text-anchor="middle" class="tiny">
    <tspan x="1340" dy="0">POST-CALL WEBHOOK</tspan>
  </text>

</svg>
