<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-label="WEBSOCKET CONNECTIVITY">
  <defs>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#1a1d22" stroke-width="3" opacity="0.7"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8d75ff"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d8e8"/>
    </marker>
    <style>
      svg { background: #020303; }
      .title { font: 700 44px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f0f0; letter-spacing: 9px; }
      .label { font: 700 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f0f0; letter-spacing: 3px; }
      .small { font: 700 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #a8abb4; letter-spacing: 2px; }
      .tiny { font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #a8abb4; letter-spacing: 1px; }
      .panel { fill: url(#hatch); stroke: #4a4d55; stroke-width: 2; }
      .box { fill: #020303; stroke: #4a4d55; stroke-width: 2.5; }
      .purple { stroke: #8d75ff; }
      .cyan { stroke: #00d8e8; }
      .purpleText { fill: #8d75ff; }
      .cyanText { fill: #00d8e8; }
      .flow { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 14 22; animation: dash 1.8s linear infinite; }
      .flow.fast { animation-duration: 1.35s; }
      .flow.slow { animation-duration: 2.4s; }
      .dim { opacity: 0.72; }
      .pulse { filter: url(#glow); animation: pulse 1.7s ease-in-out infinite; transform-origin: center; }
      @keyframes dash { to { stroke-dashoffset: -36; } }
      @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .pulse { animation: none; }
      }
    </style>
  </defs>
  <rect width="1672" height="941" fill="#020303"/>
  <text x="836" y="70" text-anchor="middle" class="title">WEBSOCKET CONNECTIVITY</text>
  
  <rect x="86" y="348" width="300" height="150" rx="16" class="box purple "/>
  <text x="236" y="401" text-anchor="middle" class="label">
    <tspan x="236" dy="0">BROWSER</tspan>
    <tspan x="236" dy="30">APP</tspan>
    <tspan x="236" dy="30">CLIENT</tspan>
  </text>
  <rect x="526" y="348" width="320" height="150" rx="16" class="box cyan "/>
  <text x="686" y="416" text-anchor="middle" class="label">
    <tspan x="686" dy="0">PIPE</tspan>
    <tspan x="686" dy="30">WSS ENDPOINT</tspan>
  </text>
  <rect x="980" y="242" width="366" height="360" rx="18" class="panel cyan"/>
  <text x="1163" y="286" text-anchor="middle" class="label cyanText">
    <tspan x="1163" dy="0">UNPOD SPEECH PIPELINE</tspan>
  </text>
  <rect x="1024" y="336" width="278" height="62" rx="12" class="box cyan"/>
  <text x="1163" y="373" text-anchor="middle" class="small">
    <tspan x="1163" dy="0">STT + VAD</tspan>
  </text>
  <rect x="1024" y="442" width="278" height="62" rx="12" class="box cyan"/>
  <text x="1163" y="479" text-anchor="middle" class="small">
    <tspan x="1163" dy="0">TTS + BARGE-IN</tspan>
  </text>
  <rect x="1462" y="348" width="170" height="150" rx="16" class="box purple "/>
  <text x="1547" y="416" text-anchor="middle" class="label">
    <tspan x="1547" dy="0">YOUR</tspan>
    <tspan x="1547" dy="30">RUNNER</tspan>
  </text>
  <path d="M386 423 H516" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <text x="454" y="390" text-anchor="middle" class="tiny cyanText">
    <tspan x="454" dy="0">WSS</tspan>
  </text>
  <path d="M846 423 H970" class="flow cyan " stroke="#00d8e8" marker-end="url(#arrow-cyan)"/>
  <path d="M1346 423 H1452" class="flow purple " stroke="#8d75ff" marker-end="url(#arrow-purple)"/>
  <text x="1400" y="390" text-anchor="middle" class="tiny purpleText">
    <tspan x="1400" dy="0">TEXT</tspan>
  </text>

</svg>
