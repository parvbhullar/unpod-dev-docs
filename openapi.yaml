      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - number_ids
              properties:
                number_ids:
                  type: array
                  items:
                    type: integer
                  example: [501]
                bridge_slug:
                  type: string
                  description: "Optional explicit bridge; auto-resolved when omitted."
                region:
                  type: string
                  example: "IN"
            example:
              number_ids: [501]
      responses:
        '201':
          description: Numbers mapped to trunk; origin endpoint returned
          content:
            application/json:
              example:
                status_code: 201
                message: "Numbers mapped to trunk."
                data:
                  trunk_id: 21
                  origin_endpoint:
                    ingress: "sip:sip.unpod.tel"
                    dids: ["+15551234567"]
                    accepted_source_ips: ["1.2.3.4", "5.6.7.0/24"]
                    region: "us-east"
                  numbers:
                    - number_id: 501
                      number: "+15551234567"
                      connection_state: "NOT_LINKED"
                      ok: true
        '400':
          description: No numbers could be mapped
          content:
            application/json:
              example:
                status_code: 400
                message: "No numbers could be mapped."
                data:
                  trunk_id: 21
                  origin_endpoint:
                    ingress: "sip:sip.unpod.tel"
                    dids: []
                    accepted_source_ips: ["1.2.3.4", "5.6.7.0/24"]
                    region: null
                  numbers:
                    - number_id: 501
                      ok: false
                      error: "Number not found or not available to this organization."
        '404':
          description: Trunk not found
          content:
            application/json:
              example:
                status_code: 404
                message: "Trunk not found."
