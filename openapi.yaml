            application/json:
              example:
                status_code: 200
                message: "Trunks fetched successfully."
                data:
                  - id: 12
                    name: "Acme Primary Trunk"
                    sip_url: "sip:sip.acme-voice.com"
                    transport: "tcp"
                    port: "5060"
                    auth_username: null
                    auth_password: null
                    allowed_ips: ""
                    active: true
                    org_handle: "acme.co"
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      operationId: createTrunk
      summary: Create Trunk
      tags: [Trunks]
      security:
        - TokenAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgHandle'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - sip_url
              properties:
                name:
                  type: string
                  example: "My Carrier Trunk"
                sip_url:
                  type: string
                  description: "Carrier SIP URL / host."
                  example: "sip:carrier.net"
                auth_username:
                  type: string
                  example: "user"
                auth_password:
                  type: string
                  example: "pass"
                transport:
                  type: string
                  enum: [tcp, udp, tls]
                  default: tcp
                  example: "tcp"
                port:
                  type: string
                  default: "5060"
                  example: "5060"
                source_ips:
                  type: array
                  description: "Carrier source IP allow-list (CIDR allowed)."
                  items:
                    type: string
                  example: ["1.2.3.4", "5.6.7.0/24"]
            example:
              name: "My Carrier Trunk"
              sip_url: "sip:carrier.net"
              auth_username: "user"
              auth_password: "pass"
              transport: "tcp"
              port: "5060"
              source_ips: ["1.2.3.4", "5.6.7.0/24"]
      responses:
        '201':
          description: Trunk created (auth_password masked in response)
          content:
            application/json:
              example:
                status_code: 201
                message: "Trunk created successfully."
                data:
                  id: 21
                  name: "My Carrier Trunk"
                  sip_url: "sip:carrier.net"
                  transport: "tcp"
                  port: "5060"
                  auth_username: "user"
                  auth_password: "pass"
                  allowed_ips: "1.2.3.4,5.6.7.0/24"
                  active: true
                  org_handle: "acme.co"
        '400':
          description: Invalid trunk payload
          content:
            application/json:
              example:
                status_code: 400
                message: "Invalid trunk payload"
                error:
                  sip_url: ["This field is required."]
        '401':
          $ref: '#/components/responses/Unauthorized'

