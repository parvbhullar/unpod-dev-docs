                    id: 42
                    name: "My Livekit Configuration"
                    provider: 2
        '400':
          description: Missing field, number on another bridge, provider configuration not found, or link failed
          content:
            application/json:
              example:
                status_code: 400
                message: "Provided number is already assigned to another bridge."
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/platform/telephony/bridges/{slug}/disconnect-provider/:
    post:
      operationId: disconnectProviderFromBridge
      summary: Disconnect Provider from Bridge
      tags: [Bridges]
      security:
        - TokenAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: "sales-bridge-001"
        - $ref: '#/components/parameters/OrgHandle'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - number_id
              properties:
                number_id:
                  type: integer
                  description: ID of a number on this bridge
                  example: 25
            example:
              number_id: 25
      responses:
        '200':
          description: Number (and its provider link) removed from the bridge
          content:
            application/json:
              example:
                status_code: 200
                message: "Provider disconnected from number +1234567890."
                data: {}
        '404':
          description: Bridge not found, or the number is not on this bridge
          content:
            application/json:
              example:
                message: "Number is not assigned to this bridge."
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Telephony ────────────────────────────────────────────────
  /api/v2/platform/telephony/overview/:
    get:
      operationId: getTelephonyOverview
      summary: Telephony Overview
      tags: [Telephony]
      security:
        - TokenAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgHandle'
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Per-number lifecycle overview for the organization
          content:
            application/json:
              example:
                status_code: 200
                message: "Telephony overview fetched successfully."
                data:
                  - number_id: 501
                    number: "+15551234567"
                    bridge_slug: "support-bridge"
                    connection_state: "LINKED"
                    termination_kind: "sip"
                    agent_id: null
                    provider: "My Carrier"
                    provider_credential_id: 21
                    sync_state: "in_sync"
                    sync_detail: null
                    in_sync: true
        '206':
          description: Business logic error (missing header / org not found)
          content:
            application/json:
              example:
                message: "Please provide Org-Handle in headers"
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Trunks ───────────────────────────────────────────────────
  /api/v2/platform/telephony/trunks/:
    get:
      operationId: listTrunks
      summary: List Trunks
      tags: [Trunks]
      security:
        - TokenAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgHandle'
      responses:
        '200':
          description: List of the organization's SIP trunks (secrets masked)
          content:
            application/json:
              example:
                status_code: 200
                message: "Trunks fetched successfully."
                data:
                  - id: 12
                    name: "Acme Primary Trunk"
                    sip_url: "sip:carrier.example.com"
                    transport: "tcp"
                    port: "5060"
                    auth_username: null
                    auth_password: null
                    allowed_ips: ""
                    active: true
                    org_handle: "acme.co"
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      operationId: createTrunk
      summary: Create Trunk
      tags: [Trunks]
      security:
        - TokenAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgHandle'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - sip_url
              properties:
                name:
                  type: string
                  example: "My Carrier Trunk"
                sip_url:
                  type: string
                  description: "Carrier SIP URL / host."
                  example: "sip:carrier.example.com"
                auth_username:
                  type: string
                  example: "user"
                auth_password:
                  type: string
                  example: "pass"
                transport:
                  type: string
                  enum: [tcp, udp, tls]
                  default: tcp
                  example: "tcp"
                port:
                  type: string
                  default: "5060"
                  example: "5060"
                source_ips:
                  type: array
                  description: "Carrier source IP allow-list (CIDR allowed)."
                  items:
                    type: string
                  example: ["1.2.3.4", "5.6.7.0/24"]
            example:
              name: "My Carrier Trunk"
              sip_url: "sip:carrier.example.com"
              auth_username: "user"
              auth_password: "pass"
              transport: "tcp"
              port: "5060"
              source_ips: ["1.2.3.4", "5.6.7.0/24"]
      responses:
        '201':
          description: Trunk created (auth_password masked in response)
          content:
            application/json:
              example:
                status_code: 201
                message: "Trunk created successfully."
                data:
                  id: 21
                  name: "My Carrier Trunk"
                  sip_url: "sip:carrier.example.com"
                  transport: "tcp"
                  port: "5060"
                  auth_username: "user"
                  auth_password: "************pass"
                  allowed_ips: "1.2.3.4,5.6.7.0/24"
                  active: true
                  org_handle: "acme.co"
        '400':
          description: Invalid trunk payload
          content:
            application/json:
              example:
                status_code: 400
                message: "Invalid trunk payload"
                error:
                  sip_url: ["This field is required."]
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/platform/telephony/trunks/{id}/:
    get:
      operationId: getTrunk
      summary: Get Trunk
      tags: [Trunks]
      security:
        - TokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 12
        - $ref: '#/components/parameters/OrgHandle'
      responses:
        '200':
          description: Trunk detail (secrets masked)
          content:
            application/json:
              example:
                status_code: 200
                message: "Trunk fetched successfully."
                data:
                  id: 12
                  name: "Acme Primary Trunk"
                  sip_url: "sip:carrier.example.com"
                  transport: "tcp"
                  port: "5060"
                  auth_username: null
                  auth_password: null
                  allowed_ips: ""
                  active: true
                  org_handle: "acme.co"
        '404':
          description: Trunk not found
          content:
            application/json:
              example:
                status_code: 404
                message: "Trunk not found."
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      operationId: deleteTrunk
      summary: Delete Trunk
      tags: [Trunks]
      security:
        - TokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 21
        - $ref: '#/components/parameters/OrgHandle'
      responses:
        '204':
          description: Trunk deleted successfully
        '404':
          description: Trunk not found
          content:
            application/json:
              example:
                status_code: 404
                message: "Trunk not found."
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/platform/telephony/trunks/{id}/attach-numbers/:
    post:
      operationId: attachNumbersToTrunk
      summary: Attach Numbers to Trunk
      tags: [Trunks]
      security:
        - TokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 21
        - $ref: '#/components/parameters/OrgHandle'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - number_ids
              properties:
                number_ids:
                  type: array
                  items:
                    type: integer
                  example: [501]
                bridge_slug:
                  type: string
                  description: "Optional explicit bridge; auto-resolved when omitted."
                region:
                  type: string
                  example: "IN"
            example:
              number_ids: [501]
      responses:
        '201':
          description: Numbers mapped to trunk; origin endpoint returned
          content:
            application/json:
              example:
                status_code: 201
                message: "Numbers mapped to trunk."
                data:
                  trunk_id: 21
                  origin_endpoint:
                    ingress: "sip-lb1.unpod.tel"
                    dids: ["+15551234567"]
                    accepted_source_ips: ["1.2.3.4", "5.6.7.0/24"]
                    region: "us-east"
                  numbers:
                    - number_id: 501
                      number: "+15551234567"
                      connection_state: "NOT_LINKED"
                      ok: true
        '400':
          description: No eligible numbers, or none of the eligible numbers could be mapped
          content:
            application/json:
              examples:
                no_eligible_numbers:
                  summary: No id is an active NOT_ASSIGNED number (seen live)
                  value:
                    status_code: 400
                    message: "No valid unassigned numbers found."
                    data: {}
                mapping_failed:
                  summary: Eligible numbers, but mapping failed
                  value:
                    status_code: 400
                    message: "No numbers could be mapped."
                    data:
                      trunk_id: 21
                      origin_endpoint:
                        ingress: "sip-lb1.unpod.tel"
                        dids: []
                        accepted_source_ips: ["1.2.3.4", "5.6.7.0/24"]
                        region: null
                      numbers:
                        - number_id: 501
                          ok: false
                          error: "Failed to map number."
        '404':
          description: Trunk not found
          content:
            application/json:
              example:
                status_code: 404
                message: "Trunk not found."
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/platform/telephony/trunks/{id}/detach-numbers/:
    post:
      operationId: detachNumbersFromTrunk
      summary: Detach Numbers from Trunk
      tags: [Trunks]
      security:
        - TokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 21
        - $ref: '#/components/parameters/OrgHandle'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - number_ids
              properties:
                number_ids:
                  type: array
                  items:
                    type: integer
                  example: [501]
            example:
              number_ids: [501]
      responses:
        '200':
          description: Numbers unmapped from trunk (partial-success per number)
          content:
            application/json:
              example:
                status_code: 200
                message: "Numbers unmapped from trunk."
                data:
                  trunk_id: 21
                  numbers:
                    - number_id: 501
                      ok: true
        '404':
          description: Trunk not found
          content:
            application/json:
              example:
                status_code: 404
                message: "Trunk not found."
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Billing ──────────────────────────────────────────────────
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "Format: Token <your-api-key>"

  parameters:
    OrgHandle:
      name: Org-Handle
      in: header
      required: true
      schema:
        type: string
        example: "unpod.tv"
      description: "Organization domain handle"
    ProductId:
      name: Product-Id
      in: header
      required: false
      schema:
        type: string
        example: "unpod.dev"
      description: "Product scope for the auto-resolved bridge (default unpod.dev)"

  responses:
    Unauthorized:
      description: Unauthorized - Invalid or missing API token
      content:
        application/json:
          example:
            status_code: 401
            message: "Authentication credentials were not provided."
    NotOrgMember:
      description: Forbidden - you are not a member of the Org-Handle organization
      content:
        application/json:
          example:
            status_code: 403
            message: "You are not a member of this organization"
    NotFound:
      description: Resource not found
      content:
        application/json:
          example:
            status_code: 404
            message: "Not found."
