  # ─── Call Detail Records (CDR) ────────────────────────────────
  /api/v2/platform/cdr/:
    get:
      operationId: getCDRs
      summary: Get Call Detail Records
      tags: [Call Logs]
      security:
        - TokenAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgHandle'
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: page_size
          in: query
          description: Records per page (default 10)
          schema:
            type: integer
            example: 20
        - name: call_type
          in: query
          schema:
            type: string
            enum: [inbound, outbound]
            example: outbound
        - name: call_status
          in: query
          schema:
            type: string
            enum: [completed, notConnected, failed]
            example: completed
        - name: start_time
          in: query
          description: "Calls that started on or after this date. Format DD-MM-YYYY HH:MM:SS; only the date part is used"
          schema:
            type: string
            example: "01-11-2025 00:00:00"
        - name: end_time
          in: query
          description: "Calls that ended on or before this date. Format DD-MM-YYYY HH:MM:SS; only the date part is used"
          schema:
            type: string
            example: "30-11-2025 23:59:59"
        - name: source_number
          in: query
          description: Source number starts with this value
          schema:
            type: string
        - name: destination_number
          in: query
          description: Destination number starts with this value
          schema:
            type: string
        - name: bridge
          in: query
          description: Bridge name contains this value
          schema:
            type: string
        - name: call_id
          in: query
          description: Record id contains this value
          schema:
            type: string
        - name: call_duration
          in: query
          description: Calls at most this many seconds long
          schema:
            type: integer
        - name: sort
          in: query
