openapi: 3.0.3
info:
  title: Unpod API
  description: REST API for Unpod Voice AI Platform
  version: 2.0.0

servers:
  - url: https://qa3.unpod.tv/
    description: QA
  - url: https://unpod.ai/
    description: Production

tags:
  - name: Organisation
  - name: Spaces
  - name: Agents
  - name: Tasks
  - name: Runs
  - name: Call Logs
  - name: Analytics
  - name: Providers
  - name: Bridges
  - name: Numbers
  - name: Trunks
  - name: Telephony
  - name: Billing

paths:

  # ─── Organisation ────────────────────────────────────────────
  /api/v2/platform/organizations/:
    get:
      operationId: getOrganizations
      summary: Get Organizations
      tags: [Organisation]
      security:
        - TokenAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgHandle'
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              example:
                count: 3
                status_code: 200
                message: "Organizations fetched successfully"
                data:
                  - id: 1
                    name: "Unpod TV"
                    domain_handle: "unpod.tv"
                    created_at: "2024-01-15T10:30:00Z"
                  - id: 2
                    name: "Recalll"
                    domain_handle: "recalll.co"
                    created_at: "2024-03-20T08:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Spaces ──────────────────────────────────────────────────
  /api/v2/platform/spaces/:
    get:
      operationId: getAllSpaces
      summary: Get All Spaces
      tags: [Spaces]
      security:
        - TokenAuth: []
      parameters:
        - $ref: '#/components/parameters/OrgHandle'
      responses:
        '200':
          description: List of all spaces
          content:
            application/json:
              example:
                count: 207
                status_code: 200
                message: "Spaces fetched successfully"
                data:
                  - id: "sp_001"
                    name: "Sales Outreach Q1"
                    token: "8KZAMRAHSXXXXXXMAYNASMJC"
                    agent_handle: "space-agent-8qmk42nslp91wrh3dz7btxc4"
                    created_at: "2026-01-10T08:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/platform/spaces/{space_token}/:
    get:
      operationId: getSpaceByToken
      summary: Get Space by Token
      tags: [Spaces]
      security:
        - TokenAuth: []
      parameters:
        - name: space_token
          in: path
          required: true
          schema:
            type: string
            example: "8KZAMRAHSXXXXXXMAYNASMJC"
        - $ref: '#/components/parameters/OrgHandle'
      responses:
        '200':
          description: Space details
          content:
            application/json:
              example:
                status_code: 200
                message: "Space fetched successfully"
                data:
                  id: "sp_001"
                  name: "Sales Outreach Q1"
                  token: "8KZRTQP7BNW5XEDLORYUHMJC"
                  agent_handle: "space-agent-8qmk42nslp91wrh3dz7btxc4"
                  created_at: "2026-01-10T08:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/platform/spaces/{space_token}/tasks/:
    get:
      operationId: getTasksBySpaceToken
      summary: Get Tasks by Space Token
      tags: [Spaces]
      security:
        - TokenAuth: []
      parameters:
        - name: space_token
          in: path
          required: true
          schema:
            type: string
            example: "8KZAMRAHSXXXXXXMAYNASMJC"
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: page_size
          in: query
          schema:
            type: integer
            example: 20
        - $ref: '#/components/parameters/OrgHandle'
      responses:
        '200':
          description: List of tasks in the space
          content:
            application/json:
              example:
                count: 45
                status_code: 200
                message: "Tasks Fetched Successfully"
                data:
                  - _id: "697debb84c27faa892bfa0cc"
                    thread_id: "thread_9xkL2mQpR7vNwY4sZ3cJ8hF1"
                    user_info:
                      email: "user@example.com"
                      full_name: "John Doe"
                    task_id: "T8ff2ccdffe9a11f0878d43cd8a99e069"
                    run_id: "R8ff2ccdefe9a11f0878d43cd8a99e069"
                    task:
                      objective: "Call the lead and discuss the project requirements."
                    input:
                      name: "John Doe"
                      contact_number: "1234567890"
                      email: "john@example.com"
                      context: "Follow up on proposal"
                    output:
                      call_id: "CALL_7dAb3kR9mXvQ2pLw"
                      start_time: "2026-02-07T05:57:45Z"
                      end_time: "2026-02-07T06:02:30Z"
                      duration: 285
                      recording_url: "https://cdn.unpod.dev/recordings/CALL_7dAb3kR9mXvQ2pLw.mp3"
