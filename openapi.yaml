openapi: 3.0.3
info:
  title: Unpod API
  description: REST API for Unpod Voice AI Platform
  version: 2.0.0

servers:
  - url: https://unpod.dev/
    description: Developers (unpod.dev)
  - url: https://unpod.ai/
    description: Platform (unpod.ai)

tags:
  - name: Organisation
  - name: Spaces
  - name: Agents
  - name: Tasks
  - name: Runs
  - name: Call Logs
  - name: Analytics
  - name: Providers
  - name: Bridges
  - name: Numbers
  - name: Trunks
  - name: Telephony
  - name: Billing

paths:

  # ─── Organisation ────────────────────────────────────────────
  # ─── Spaces ──────────────────────────────────────────────────
  /api/v2/platform/spaces/{space_token}/tasks/:
    get:
      operationId: getTasksBySpaceToken
      summary: Get Tasks by Space Token
      tags: [Spaces]
      security:
        - TokenAuth: []
      parameters:
        - name: space_token
          in: path
          required: true
          schema:
            type: string
            example: "8KZAMRAHSXXXXXXMAYNASMJC"
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: page_size
          in: query
          description: Tasks per page (default 50)
          schema:
            type: integer
            example: 50
        - name: search
          in: query
          description: Case-insensitive match on the contact name or number
          schema:
            type: string
        - name: call_type
          in: query
          schema:
            type: string
            enum: [inbound, outbound]
        - name: from_ts
          in: query
          description: Only tasks created at or after this Unix timestamp (seconds)
          schema:
            type: integer
        - name: to_ts
          in: query
          description: Only tasks created at or before this Unix timestamp (seconds)
          schema:
            type: integer
        - name: status
          in: query
          description: Comma-separated values matched against output.post_call_data.summary.status
          schema:
            type: string
      responses:
        '200':
          description: List of tasks in the space
          content:
            application/json:
              example:
                count: 45
                status_code: 200
                message: "Tasks Fetched Successfully"
                data:
                  - _id: "697debb84c27faa892bfa0cc"
                    thread_id: "thread_9xkL2mQpR7vNwY4sZ3cJ8hF1"
                    user_info:
                      email: "user@example.com"
                      full_name: "John Doe"
                    task_id: "T8ff2ccdffe9a11f0878d43cd8a99e069"
                    run_id: "R8ff2ccdefe9a11f0878d43cd8a99e069"
                    task:
                      objective: "Call the lead and discuss the project requirements."
                    input:
                      name: "John Doe"
                      contact_number: "1234567890"
                      email: "john@example.com"
                      context: "Follow up on proposal"
                    output:
                      call_id: "CALL_7dAb3kR9mXvQ2pLw"
                      start_time: "2026-02-07T05:57:45Z"
                      end_time: "2026-02-07T06:02:30Z"
                      duration: 285
                      recording_url: "https://cdn.unpod.dev/recordings/CALL_7dAb3kR9mXvQ2pLw.mp3"
                      transcript:
                        - role: "agent"
                          content: "Hello, this is an AI assistant calling on behalf of Unpod. Am I speaking with John Doe?"
                        - role: "user"
                          content: "Yes, this is John."
                      post_call_data:
                        summary: "The agent successfully connected with John Doe and discussed project requirements."
                        outcome: "interested"
                        sentiment: "positive"
                      call_type: "outbound"
                      call_status: "completed"
                    assignee: "space-agent-8qmk42nslp91wrh3dz7btxc4"
                    status: "completed"
                    execution_type: "call"
                    run_mode: "prod"
                    created: "2026-02-07T05:57:45Z"
                    modified: "2026-02-07T06:02:35Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTask
      summary: Create a Task - Make Voice AI Call
      tags: [Tasks]
      security:
        - TokenAuth: []
      parameters:
        - name: space_token
          in: path
          required: true
          schema:
            type: string
            example: "8KZAMRAHSXXXXXXMAYNASMJC"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pilot
                - context
                - documents
              properties:
                pilot:
                  type: string
                  description: Agent/pilot handle to assign the task
                  example: "space-agent-f1o3qjm1y7q1avvuynv4vprb1"
                documents:
                  type: array
                  description: Array of contact/document objects
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "John Doe"
                      email:
                        type: string
                        example: "john@example.com"
                      contact_number:
                        type: string
                        example: "1234567890"
                      alternate_number:
                        type: string
                        example: "+919876543210"
                      occupation:
                        type: string
                        example: "Sales Manager"
                      company_name:
                        type: string
                        example: "Acme Corp"
                      address:
                        type: string
                        example: "123 Main St, Mumbai"
                      about:
                        type: string
                        example: "Warm lead from webinar"
                      context:
                        type: string
                        example: "Follow up on proposal sent last week"
                      labels:
                        type: array
                        items:
                          type: string
                        example: ["warm-lead", "webinar"]
                      title:
                        type: string
                        example: "Q1 Outreach"
                      description:
                        type: string
                        example: "Lead from Q1 campaign"
                      document_id:
                        type: string
                        example: "6902fb5840a736e125e80ebc"
                context:
                  type: string
                  description: Context/objective for the task
                  example: "Call the lead and discuss the project requirements."
                schedule:
                  type: object
                  description: When to place the calls. Omit, or send type now, to call right away.
                  required: [type]
                  properties:
                    type:
                      type: string
                      enum: [now, auto, custom]
                      description: "now, auto (agent's calling schedule) or custom. Case-insensitive."
                    calling_date:
                      type: string
                      description: Required when type is custom. YYYY-MM-DD.
                      example: "2026-03-15"
                    calling_time:
                      type: string
                      description: Required when type is custom. ISO time.
                      example: "20:08:00+05:30"
                  example:
                    type: "now"
            example:
              pilot: "space-agent-f1o3qjm1y7q1avvuynv4vprb1"
              context: "Call the lead and discuss the project requirements."
              schedule:
                type: "now"
              documents:
                - name: "John Doe"
                  email: "john@example.com"
                  contact_number: "1234567890"
                  alternate_number: "+919876543210"
                  occupation: "Sales Manager"
                  company_name: "Acme Corp"
                  address: "123 Main St, Mumbai"
                  about: "Warm lead from webinar"
                  context: "Follow up on proposal sent last week"
                  labels: ["warm-lead", "webinar"]
                  title: "Q1 Outreach"
                  description: "Lead from Q1 campaign"
                  document_id: "6902fb5840a736e125e80ebc"
      responses:
        '200':
          description: Task created successfully
          content:
            application/json:
              example:
                status_code: 200
                message: "Task Created Successfully"
                data:
                  run_id: "R74802366fe9011f0878d43cd8a99e069"
                  task_ids:
                    - "T74802367fe9011f0878d43cd8a99e069"
                  status:
                    T74802367fe9011f0878d43cd8a99e069: "pending"
        '206':
          description: Validation error, invalid space token, or no access to the space
          content:
            application/json:
              example:
                status_code: 206
                message: "There is some Validation error"
                data: {}
                errors:
                  context: ["This field is required."]
        '402':
          description: The organization can't place calls right now (for example, credits exhausted)
          content:
            application/json:
              example:
                error: "insufficient_balance"
                block_reason: "bits_exhausted"
                message: "You're out of call credits. Please buy credits to resume calls."
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Agents ──────────────────────────────────────────────────
  /api/v2/platform/agents/:
